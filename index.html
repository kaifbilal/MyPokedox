<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pokedex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="black-bg">
        <div class="white-bg">
            <div class="header">
                <h1>Welcome to My Pokedex</h1>
            </div>
            <div class="black-strip">
                <section id="searchSection">
                    <h2>Name or Number</h2>
                    <input type="text" id="search" placeholder="Enter Pokémon name or number">
                    <button class="searchButton" id="searchBtn">Search</button>
                    <p>Only 1025 pokemon Data available</p>
                </section>
            </div>
            <div class="plain-bg">
                <div id="results" class="results-container"></div>
            </div>
        </div>
    </div>
    <script src="pokedex.js"></script>
</body>
</html>
